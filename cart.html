<!DOCTYPE html>
<html lang="ru">
<head>
    <base href="/The-Razzing-project/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Бойцовский клуб</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Стили для корзины -->
    <style>
        .cart-container { padding: 60px 0; max-width: 900px; margin: 0 auto; }
        .cart-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); padding: 20px; margin-bottom: 15px;
            border: 1px solid #333; border-radius: 4px;
        }
        .cart-img { width: 120px; height: 60px; object-fit: cover; border-radius: 4px; }
        .cart-info { flex-grow: 1; margin-left: 20px; }
        .cart-info h3 { font-size: 20px; margin-bottom: 5px; }
        .cart-info p { color: var(--accent-color); font-weight: bold; font-size: 18px; }
        .cart-qty { display: flex; align-items: center; gap: 15px; margin-right: 30px; }
        .cart-qty button {
            background: none; border: 1px solid var(--accent-color); color: var(--accent-color);
            width: 32px; height: 32px; cursor: pointer; border-radius: 4px; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .cart-qty button:hover { background: var(--accent-color); color: white; }
        .cart-remove { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; }
        .cart-remove:hover { text-decoration: underline; }
        
        .cart-summary { 
            text-align: right; margin-top: 40px; padding-top: 20px; 
            border-top: 2px solid var(--accent-color); 
        }
        .cart-total { font-size: 28px; font-family: var(--font-heading); margin-bottom: 20px; }
        .cart-total span { color: var(--accent-color); }
        
        .empty-cart { text-align: center; padding: 50px 0; color: var(--text-muted); }

        @media (max-width: 600px) {
            .cart-item { flex-direction: column; text-align: center; gap: 15px; }
            .cart-info { margin-left: 0; }
            .cart-qty { margin-right: 0; }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">FIGHT CLUB COFFEE</a>
            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="login.html" class="nav-link">Вход</a>
            </nav>
            <div class="header-actions">
                <!-- Кнопка корзины ведет на эту же страницу -->
                <a href="cart.html" class="cart-btn" style="text-decoration: none;">Корзина (<span id="cart-count">0</span>)</a>
                <button class="burger" id="burger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main>
        <section class="container cart-container">
            <h1 class="hero-title" style="font-size: 42px; text-align: left; margin-bottom: 40px;">ВАША КОРЗИНА</h1>
            
            <!-- Сюда скрипт будет вставлять товары -->
            <div id="cart-items-container"></div>

            <!-- Итоговая сумма -->
            <div class="cart-summary" id="cart-summary" style="display: none;">
                <div class="cart-total">Итого: <span id="cart-total-price">0 ₽</span></div>
                <button class="btn btn-primary" onclick="alert('Заказ оформлен! (Имитация)');">ОФОРМИТЬ ЗАКАЗ</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Fight Club Coffee. Учебный проект.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    
    <!-- СКРИПТ ДЛЯ ОТРИСОВКИ КОРЗИНЫ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderCart();
        });

        function renderCart() {
            // Берем данные из памяти
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cart-items-container');
            const summary = document.getElementById('cart-summary');
            const totalPriceEl = document.getElementById('cart-total-price');

            // Если корзина пуста
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Корзина пуста</h2>
                        <p style="margin: 20px 0;">Самое время это исправить.</p>
                        <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                    </div>`;
                summary.style.display = 'none';
                return;
            }

            // Если есть товары
            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <img src="${item.img}" alt="${item.title}" class="cart-img">
                        <div class="cart-info">
                            <h3>${item.title}</h3>
                            <p>${item.price} ₽</p>
                        </div>
                        <div class="cart-qty">
                            <button onclick="changeQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <button class="cart-remove" onclick="removeItem(${index})">Удалить</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalPriceEl.textContent = total + ' ₽';
            summary.style.display = 'block';
            
            // Обновляем счетчик в шапке
            updateCartCount();
        }

        // Функция изменения количества (+ и -)
        function changeQty(index, delta) {
            const cart = JSON.parse(localStorage.getItem('cart'));
            cart[index].qty += delta;
            
            if (cart[index].qty <= 0) {
                cart.splice(index, 1); // Если 0, удаляем
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart(); // Перерисовываем страницу
        }

        // Функция удаления товара
        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem('cart'));
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
    </script>
</body>
</html>
