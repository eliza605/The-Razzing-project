<!DOCTYPE html>
<html lang="ru">
<head>
    <base href="/The-Razzing-project/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Бойцовский клуб</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 40px; border: 1px solid #333; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; margin-bottom: 30px; color: var(--accent-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #444; color: white; border-radius: 4px; font-family: var(--font-body); }
        .form-group input:focus { outline: none; border-color: var(--accent-color); }
        .auth-btn { width: 100%; margin-top: 10px; }
        .auth-link { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .auth-link:hover { color: var(--accent-color); }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">FIGHT CLUB COFFEE</a>
            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <!-- Даем этой ссылке ID auth-link, чтобы JS мог её менять -->
                <a href="login.html" class="nav-link active" id="auth-link">Вход</a>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-btn" style="text-decoration: none;">Корзина (<span id="cart-count">0</span>)</a>
                <button class="burger" id="burger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h2>ВХОД В КЛУБ</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="tyler@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">ВОЙТИ</button>
            </form>
            <a href="#" class="auth-link" style="color: var(--accent-color);">Зарегистрироваться</a>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Останавливаем перезагрузку
            
            const email = document.getElementById('email').value;
            
            // Сохраняем пользователя в память браузера
            localStorage.setItem('currentUser', email);
            
            // Перекидываем в личный кабинет
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
